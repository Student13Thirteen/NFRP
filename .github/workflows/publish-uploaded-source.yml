name: Publish uploaded NFRP source

on:
  push:
    branches: [main]
    paths:
      - 'NFRP_PUBLIC_READY_2026-07-31.zip'
      - '.github/workflows/publish-uploaded-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfrp-public-source-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source package
        shell: bash
        run: |
          set -euo pipefail
          archive='NFRP_PUBLIC_READY_2026-07-31.zip'
          [[ -f "$archive" ]] || {
            echo "Upload $archive to the repository root before running this workflow." >&2
            exit 1
          }
          echo '507a38a08519b70f1b4b3363936f5b399a3f96b27cc8890585d3a80c80300807  NFRP_PUBLIC_READY_2026-07-31.zip' | sha256sum -c -
          unzip -t "$archive"
          rm -rf /tmp/nfrp-public
          mkdir -p /tmp/nfrp-public
          unzip -q "$archive" -d /tmp/nfrp-public
          source_root='/tmp/nfrp-public/nfrp'
          required=(
            README.md LICENSE package.json package-lock.json
            docker-compose.yml Dockerfile nfrp
            prisma/schema.prisma scripts/validate-public-repo.py
            scripts/ci_smoke.sh .github/workflows/ci.yml
          )
          for path in "${required[@]}"; do
            [[ -e "$source_root/$path" ]] || {
              echo "Required source path missing: $path" >&2
              exit 1
            }
          done
          [[ ! -e "$source_root/.git" ]]
          [[ ! -e "$source_root/.env" ]]
          python3 "$source_root/scripts/validate-public-repo.py"
          bash -n "$source_root/nfrp"
          bash -n "$source_root/scripts/ci_smoke.sh"

      - name: Publish source while preserving bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          source_root='/tmp/nfrp-public/nfrp'

          # The repository token may publish source files but GitHub can reject
          # a bot commit that creates or replaces workflow definitions. Keep
          # this bootstrap workflow temporarily; the final CI workflow is
          # installed separately after the source commit lands.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github \
            -exec rm -rf -- {} +
          find .github -mindepth 1 -maxdepth 1 \
            ! -name workflows \
            -exec rm -rf -- {} +
          find .github/workflows -mindepth 1 -maxdepth 1 \
            ! -name publish-uploaded-source.yml \
            -exec rm -rf -- {} +

          rsync -a --exclude='.github/workflows/' "$source_root"/ ./
          chmod +x nfrp scripts/*.sh
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish NFRP public source'
          git push origin HEAD:main
