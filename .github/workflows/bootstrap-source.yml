name: Bootstrap NFRP source

on:
  push:
    branches: [main]
    paths:
      - '.payload/**'
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfrp-source-bootstrap
  cancel-in-progress: false

jobs:
  publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(.payload/chunk-*)
          if (( ${#chunks[@]} == 0 )); then
            echo 'No payload chunks found.' >&2
            exit 1
          fi
          printf 'Found %s payload chunks.\n' "${#chunks[@]}"
          cat "${chunks[@]}" > /tmp/nfrp-source.b64
          base64 --decode /tmp/nfrp-source.b64 > /tmp/nfrp-source.tar.xz
          xz --test /tmp/nfrp-source.tar.xz
          mkdir -p /tmp/nfrp-unpacked
          tar -xJf /tmp/nfrp-source.tar.xz -C /tmp/nfrp-unpacked

          source_root=/tmp/nfrp-unpacked
          if [[ ! -f "$source_root/package.json" ]]; then
            candidate=$(find /tmp/nfrp-unpacked -mindepth 1 -maxdepth 2 -type f -name package.json -printf '%h\n' | head -n 1)
            [[ -n "$candidate" ]] || { echo 'package.json missing from reconstructed archive.' >&2; exit 1; }
            source_root=$candidate
          fi

          required=(README.md LICENSE package.json package-lock.json docker-compose.yml Dockerfile nfrp prisma/schema.prisma scripts/validate-public-repo.py .github/workflows/ci.yml)
          for path in "${required[@]}"; do
            [[ -e "$source_root/$path" ]] || { echo "Required source path missing: $path" >&2; exit 1; }
          done

          [[ ! -e "$source_root/.git" ]] || { echo 'Archive must not contain .git.' >&2; exit 1; }
          [[ ! -e "$source_root/.env" ]] || { echo 'Archive must not contain .env.' >&2; exit 1; }
          python3 "$source_root/scripts/validate-public-repo.py"
          bash -n "$source_root/nfrp"
          bash -n "$source_root/scripts/ci_smoke.sh"
          printf '%s' "$source_root" > /tmp/nfrp-source-root

      - name: Replace bootstrap tree with public source
        shell: bash
        run: |
          set -euo pipefail
          source_root=$(cat /tmp/nfrp-source-root)
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$source_root"/. .
          chmod +x nfrp scripts/*.sh
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Source tree is already current.'
            exit 0
          fi
          git commit -m 'Publish NFRP public source'
          git push origin HEAD:main
