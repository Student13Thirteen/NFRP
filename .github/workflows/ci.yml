name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate-production-dependencies:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install patched production dependencies
        run: |
          npm pkg set overrides.next.postcss=8.5.22
          npm install --save-exact next@16.2.11 postcss@8.5.22 sharp@0.35.3
          npm install --save-dev --save-exact eslint-config-next@16.2.11
          npm audit fix || true
          npm audit --omit=dev --audit-level=high

      - name: Commit remediated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remediate production dependency advisories'
          git push origin HEAD:${{ github.head_ref }}

  quality-and-clean-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://demo:demo@127.0.0.1:65535/demo
      AUTH_SECRET: ci-only-placeholder-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Repository safety boundary
        run: python3 scripts/validate-public-repo.py

      - name: CLI and smoke-test syntax
        run: |
          bash -n nfrp
          bash -n scripts/ci_smoke.sh
          python3 scripts/smoke-login.py --help >/dev/null

      - name: ShellCheck
        # SC2163 is intentional: load_env validates the key name before
        # exporting the dynamically selected variable without evaluating it.
        run: shellcheck --severity=warning --exclude=SC2163 nfrp scripts/ci_smoke.sh

      - name: Install dependencies
        run: npm ci

      - name: Require no high production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Validate Docker Compose model
        run: ENV_FILE=.env.example docker compose --env-file .env.example config --quiet

      - name: Clean-room installation and authenticated login
        run: bash scripts/ci_smoke.sh
